<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevClub Joken Po</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Joken Po</h1>
        <p class="hint">Escolha sua jogada!</p>

        <div class="buttons" aria-label="Escolha pedra, papel ou tesoura">
            <button id="pedra" onclick="playHuman('pedra')" class="btn" aria-label="Pedra">👊</button>
            <button id="papel" onclick="playHuman('papel')" class="btn" aria-label="Papel">🖐️</button>
            <button id="tesoura" onclick="playHuman('tesoura')" class="btn" aria-label="Tesoura">✌️</button>
        </div>

        <!-- As duas escolhas são reveladas ao terminar a animação. -->
        <div class="arena">
            <div class="choice-card">
                <strong>Você</strong>
                <span id="human-hand" class="hand" aria-hidden="true">❔</span>
                <span id="human-choice">Sua escolha</span>
            </div>
            <span class="versus" aria-hidden="true">×</span>
            <div class="choice-card">
                <strong>CPU</strong>
                <span id="machine-hand" class="hand" aria-hidden="true">❔</span>
                <span id="machine-choice">Escolha da CPU</span>
            </div>
        </div>

        <p class="result" role="status" aria-live="polite" aria-atomic="true">Vamos jogar?</p>
        <p class="your-score">Sua pontuação: <span id="human-score">0</span></p>
        <p class="machine-score">Pontuação da CPU: <span id="machine-score">0</span></p>
    </main>
</body>
</html>
