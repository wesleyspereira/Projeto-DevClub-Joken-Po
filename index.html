<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevClub Joken Po</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">
        <h1>Joken Po</h1>

        <div class="buttons">

            <button id="pedra" onclick="playHuman('pedra')" class="btn">&#x1F44A;</button>
            <button id="papel" onclick="playHuman('papel')" class="btn">&#x1F590;</button>
            <button id="tesoura" onclick="playHuman('tesoura')" class="btn">&#x270C;</button>
        </div>
        <p class="result"></p>

        <p class="your-score"> Sua Pontuação: <span id="human-score">0</span></p>
        <p class="machine-score">Pontuação da Alexa: <span id="machine-score">0</span></p>

    </div>
    <script src="./script.js"></script>
</body>

</html>
